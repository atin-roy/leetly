spring:
  datasource:
    url: jdbc:h2:mem:leetly;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-must-be-at-least-32-bytes-long
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
  auth:
    secure-cookies: false
  rate-limit:
    auth:
      max-requests: 1000

spring:
  application:
    name: leetly

  # Database Connection (Uses Environment Variables)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leetly}
    username: ${SPRING_DATASOURCE_USERNAME:leetly}
    password: ${SPRING_DATASOURCE_PASSWORD:leetly}

  # JPA / Hibernate Settings
  jpa:
    # Closes DB connection immediately after Service layer (Better Performance)
    open-in-view: false
    hibernate:
      # Hibernate only checks the DB; it won't change it (Flyway's job)
      ddl-auto: validate
    properties:
      hibernate:
        # Makes SQL logs pretty and readable
        format_sql: true
    # Off by default: printing every statement is a real cost in production.
    # The dev profile turns it back on.
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

  # Migration Tool (Table Creation)
  flyway:
    # Tells Flyway to look for scripts in db/migration on startup
    enabled: true

app:
  jwt:
    # Must be at least 32 bytes. Override in every deployed environment.
    secret: ${APP_JWT_SECRET:dev-only-insecure-secret-change-me-32b}
    access-token-ttl: ${APP_JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${APP_JWT_REFRESH_TTL:P30D}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://leetly.atinroy.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

---
# --- DEVELOPMENT PROFILE ---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    # Verbose SQL logging: shows full query details for debugging
    org.hibernate.SQL: debug

---
# --- PRODUCTION PROFILE ---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    # Silent SQL logging: only logs errors/warnings to keep logs clean
    org.hibernate.SQL: info
